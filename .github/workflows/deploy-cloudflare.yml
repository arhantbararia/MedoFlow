# Build gate + deploy to Cloudflare (PART 0 / D0.6).
#
#   push to main  → build gate → deploy medoflow-api (edge Worker) + medoflow-web (Next.js)
#   failing build → deploy jobs never start (they `needs: build`)
#   manual run    → Actions › "Deploy to Cloudflare" › Run workflow › action = rollback
#
# Repo secrets:   CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + Account Settings:Read),
#                 CLOUDFLARE_ACCOUNT_ID
# Repo variable:  API_TARGET = "edge" (default, Workers Free) | "container" (Workers Paid:
#                 also builds and ships the Express API image as a Cloudflare Container)
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: deploy, or roll both Workers back to their previous version
        type: choice
        options: [deploy, rollback]
        default: deploy

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  build:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Backend — prisma generate + typecheck + build
        working-directory: backend
        run: |
          pnpm exec prisma generate
          pnpm run typecheck
          pnpm run build

      - name: API edge Worker — typecheck + bundle
        working-directory: backend/edge
        run: |
          pnpm run typecheck
          pnpm exec wrangler deploy --dry-run --outdir dist

      - name: Frontend — OpenNext build
        working-directory: frontend
        env:
          # Publishable (public) key — repo variable, not a secret. API URL comes from .env.production.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: pnpm run cf:build

      - uses: actions/upload-artifact@v4
        with:
          name: open-next
          path: frontend/.open-next
          include-hidden-files: true
          retention-days: 3

  deploy-api:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter medoflow-api-edge
      - name: wrangler deploy
        working-directory: backend/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ vars.API_TARGET }}" = "container" ]; then
            pnpm exec wrangler deploy --env container
          else
            pnpm exec wrangler deploy
          fi
      - name: Post-deploy smoke
        run: |
          curl -fsS https://medoflow-api.advertout-medoflow.workers.dev/api/v1/edge/health
          curl -fsS https://medoflow-api.advertout-medoflow.workers.dev/api/v1/edge/db

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter medoflow-frontend
      - uses: actions/download-artifact@v4
        with:
          name: open-next
          path: frontend/.open-next
      - name: wrangler deploy
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy the already-built .open-next artifact as-is; without this, wrangler hands off to
          # `opennextjs-cloudflare deploy`.
          OPEN_NEXT_DEPLOY: 'true'
        run: pnpm exec wrangler deploy
      - name: Post-deploy smoke
        run: curl -fsS -o /dev/null https://medoflow-web.advertout-medoflow.workers.dev/login

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter medoflow-api-edge --filter medoflow-frontend
      - name: Roll back both Workers to their previous version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          (cd backend/edge && pnpm exec wrangler rollback --name medoflow-api -m "CI rollback ${{ github.run_id }}" -y)
          (cd frontend && pnpm exec wrangler rollback --name medoflow-web -m "CI rollback ${{ github.run_id }}" -y)
